name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows
            rust_target: x86_64-pc-windows-msvc
            binary: kabosu-converter.exe
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: kabosu-converter
            archive_ext: tar.gz
          - os: ubuntu-26.04
            target: ubuntu-26.04-x86_64
            rust_target: x86_64-unknown-linux-gnu
            binary: kabosu-converter
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.rust_target || matrix.target }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name }}"
          $RUST_TARGET = if ("${{ matrix.rust_target }}") { "${{ matrix.rust_target }}" } else { "${{ matrix.target }}" }
          $ARCHIVE = "kabosu-converter-$TAG-${{ matrix.target }}.zip"
          $STAGE = "stage-$TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $STAGE
          Copy-Item "target/$RUST_TARGET/release/${{ matrix.binary }}" -Destination "$STAGE/"
          Compress-Archive -Path "$STAGE/*" -DestinationPath $ARCHIVE
          (Get-FileHash -Algorithm SHA256 $ARCHIVE).Hash.ToLower() + "  $ARCHIVE" | Out-File -FilePath "$ARCHIVE.sha256" -Encoding ascii
          echo "ASSET=$ARCHIVE" >> $env:GITHUB_ENV
          echo "CHECKSUM=$ARCHIVE.sha256" >> $env:GITHUB_ENV

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          TAG="${{ github.ref_name }}"
          RUST_TARGET="${{ matrix.rust_target || matrix.target }}"
          ARCHIVE="kabosu-converter-$TAG-${{ matrix.target }}.tar.gz"
          STAGE="stage-$TAG-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/$RUST_TARGET/release/${{ matrix.binary }}" "$STAGE/"
          tar -czvf "$ARCHIVE" -C "$STAGE" .
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ASSET=$ARCHIVE" >> $GITHUB_ENV
          echo "CHECKSUM=$ARCHIVE.sha256" >> $GITHUB_ENV

      - name: Generate release notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          RUN_ID="${{ github.run_id }}"

          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")

          TAG_CONTENTS=$(git tag -l --format='%(contents)' "$TAG" 2>/dev/null | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          CUSTOM_TAG_NOTES=""

          if [ -n "$TAG_CONTENTS" ]; then
              while IFS= read -r line; do
                  trimmed=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
                  [ -z "$trimmed" ] && continue
                  if echo "$trimmed" | grep -iE '^(release\s+v?|version\s+v?|v[0-9])' >/dev/null 2>&1; then
                      after_colon=$(echo "$trimmed" | sed -E 's/^(release|version)\s+v?[0-9.]+:\s*//i')
                      if [ "$after_colon" != "$trimmed" ] && [ -n "$after_colon" ]; then
                          CUSTOM_TAG_NOTES="${CUSTOM_TAG_NOTES}${after_colon}"$'\n'
                      fi
                      continue
                  fi
                  CUSTOM_TAG_NOTES="${CUSTOM_TAG_NOTES}${trimmed}"$'\n'
              done <<< "$TAG_CONTENTS"
          fi

          BODY_NOTES=""
          if [ -n "$CUSTOM_TAG_NOTES" ]; then
              while IFS= read -r note; do
                  [ -z "$note" ] && continue
                  if [[ "$note" =~ ^[-*] ]]; then
                      BODY_NOTES="${BODY_NOTES}${note}"$'\n'
                  else
                      BODY_NOTES="${BODY_NOTES}- ${note}"$'\n'
                  fi
              done <<< "$CUSTOM_TAG_NOTES"
          else
              if [ -n "$PREV_TAG" ]; then
                  RAW_COMMITS=$(git log "${PREV_TAG}..${TAG}" --no-merges --reverse --pretty=format:"%s")
              else
                  RAW_COMMITS=$(git log -n 10 --no-merges --reverse --pretty=format:"%s")
              fi

              while IFS= read -r commit_msg; do
                  [ -z "$commit_msg" ] && continue
                  if echo "$commit_msg" | grep -iE '^(chore|bump)(\(release\))?:?\s*bump\s+version' >/dev/null 2>&1; then
                      continue
                  fi
                  cleaned=$(echo "$commit_msg" | sed -E 's/^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^\)]+\))?!?:?\s*//I')
                  if [ -n "$cleaned" ]; then
                      BODY_NOTES="${BODY_NOTES}- ${cleaned}"$'\n'
                  fi
              done <<< "$RAW_COMMITS"
          fi

          if [ -z "$BODY_NOTES" ]; then
              BODY_NOTES="- Release ${TAG}"$'\n'
          fi

          BRANCH=$(git branch -r --contains "$TAG" 2>/dev/null | sed 's# *origin/##' | grep -v 'HEAD' | head -n 1)
          [ -z "$BRANCH" ] && BRANCH="${{ github.event.repository.default_branch || 'main' }}"
          [ -z "$BRANCH" ] && BRANCH="main"

          SHORT_SHA=$(git rev-parse --short "${TAG}^{commit}" 2>/dev/null || git rev-parse --short HEAD)

          FOOTER="- Release are built, signed and notarized by GitHub Actions
Built from ${BRANCH} at ${SHORT_SHA} by (https://github.com/${REPO}/actions/runs/${RUN_ID})"

          printf "%s\n%s\n" "$BODY_NOTES" "$FOOTER" > release_notes.md
          cat release_notes.md

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          body_path: release_notes.md
