[package]
name = "another-encoder"
version = "0.10.0"
description = "A modern video encoder and editor built with Rust and Slint"
edition = "2021"

[dependencies]
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.46", features = ["full"] }
chrono = "0.4"
regex = "1.11"
dirs = "6.0"
flate2 = "1.0"
rfd = "0.17.2"
tempfile = "3.27.0"
futures-util = "0.3.34"
thiserror = "2.0.21"
sha2 = "0.11.1"
hex = "0.4.3"
zip = "9.1.1"
tar = "0.4.46"
reqwest = { version = "0.13.5", features = ["default-tls", "stream"] }
xz2 = "0.1.7"
tracing = "0.1.44"

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
