name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: kabosu-converter.exe
            archive_ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: kabosu-converter
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: kabosu-converter
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: kabosu-converter
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $TAG = "${{ github.ref_name }}"
          $ARCHIVE = "kabosu-converter-$TAG-${{ matrix.target }}.zip"
          $STAGE = "stage-$TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $STAGE
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" -Destination "$STAGE/"
          Copy-Item "README.md" -Destination "$STAGE/"
          Copy-Item "LICENSE" -Destination "$STAGE/"
          Compress-Archive -Path "$STAGE/*" -DestinationPath $ARCHIVE
          (Get-FileHash -Algorithm SHA256 $ARCHIVE).Hash.ToLower() + "  $ARCHIVE" | Out-File -FilePath "$ARCHIVE.sha256" -Encoding ascii
          echo "ASSET=$ARCHIVE" >> $env:GITHUB_ENV
          echo "CHECKSUM=$ARCHIVE.sha256" >> $env:GITHUB_ENV

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          TAG="${{ github.ref_name }}"
          ARCHIVE="kabosu-converter-$TAG-${{ matrix.target }}.tar.gz"
          STAGE="stage-$TAG-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$STAGE/"
          cp README.md "$STAGE/"
          cp LICENSE "$STAGE/"
          tar -czvf "$ARCHIVE" -C "$STAGE" .
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ASSET=$ARCHIVE" >> $GITHUB_ENV
          echo "CHECKSUM=$ARCHIVE.sha256" >> $GITHUB_ENV

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          generate_release_notes: true
