[package]
name = "kabosu-converter"
version = "0.15.2"
authors = ["grimztha"]
description = "Kabosu Converter — A modern media transcoder and universal video downloader built with Rust and Slint"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/grimztha/KabosuConverter"
homepage = "https://github.com/grimztha/KabosuConverter"
readme = "README.md"
keywords = ["video", "audio", "converter", "ffmpeg", "transcoder"]
categories = ["multimedia::video", "multimedia::audio", "command-line-utilities"]

[dependencies]
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.46", features = ["full"] }
chrono = "0.4"
regex = "1.11"
dirs = "6.0"
rfd = "0.17.2"
tempfile = "3.27.0"
futures-util = "0.3.34"
thiserror = "2.0.21"
sha2 = "0.11.1"
hex = "0.4.3"
zip = "9.1.1"
tar = "0.4.46"
reqwest = { version = "0.13.5", features = ["default-tls", "stream"] }
xz2 = "0.1.7"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
