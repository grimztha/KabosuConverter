[package]
name = "another-encoder"
version = "0.8.1"
description = "A modern video encoder and editor built with Rust and Slint"
edition = "2021"

[dependencies]
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.46", features = ["full"] }
chrono = "0.4"
regex = "1.11"
dirs = "6.0"
flate2 = "1.0"
rfd = "0.17.2"
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = true
